# Hooks de git (se instalan con `npm install` vía el script "prepare")
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,cjs,ts,tsx,json,css,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    test:
      run: npm test
